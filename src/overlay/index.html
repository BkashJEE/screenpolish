<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Polish region picker</title>
    <style>
      html, body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
        font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }
      #sel {
        position: fixed;
        box-sizing: border-box;
        border: 2px solid #ffffff;
        outline: 1px solid rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.35);
        background: transparent;
        pointer-events: none;
      }
      #sel[hidden] { display: none; }
      #label {
        position: fixed;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.92);
        color: #fff;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
      }
      #label[hidden] { display: none; }
      #hint {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(20, 20, 24, 0.92);
        color: #e8e8ea;
        pointer-events: none;
      }
      #hint kbd {
        padding: 1px 6px;
        border-radius: 4px;
        background: #3a3a40;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="dim"></div>
    <div id="sel" hidden></div>
    <div id="label" hidden></div>
    <div id="hint">Drag to select a region · <kbd>Enter</kbd> confirm · <kbd>Esc</kbd> cancel</div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
